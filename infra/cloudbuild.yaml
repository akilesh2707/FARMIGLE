# Build and deploy the backend to Cloud Run.
#
#   gcloud builds submit --config infra/cloudbuild.yaml \
#       --substitutions=_REGION=asia-south1,_REPOSITORY=asia-south1-docker.pkg.dev/$PROJECT_ID/farm-images,_SERVICE=farm-intelligence-backend
#
# Set $PROJECT_ID to a project you own, and enable the APIs once:
#   gcloud services enable run.googleapis.com cloudbuild.googleapis.com \
#       artifactregistry.googleapis.com firestore.googleapis.com storage.googleapis.com
#
# Secrets (GEMINI_API_KEY, WEATHER_API_KEY) are NOT baked into the image.
# Create a secret and reference it from the service:
#   gcloud secrets create farm-gemini-api-key --data-file=-
#   gcloud run services update farm-intelligence-backend --region=$REGION \
#       --update-secrets=GEMINI_API_KEY=farm-gemini-api-key:latest

substitutions:
  _REGION: asia-south1
  _REPOSITORY: ''
  _SERVICE: farm-intelligence-backend
  # Keep mock mode ON for a demo deployment. A real deployment must set this
  # to false and attach a service account with Firestore/Storage access.
  _MOCK_SERVICES: 'true'
  _MIN_INSTANCES: '0'
  _MAX_INSTANCES: '2'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA'

steps:
  # 1. Tests run before anything is published. The suite is offline, so this
  #    needs no credentials and no secret access.
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update && apt-get install -y --no-install-recommends git >/dev/null
        python -m venv /tmp/venv
        /tmp/venv/bin/pip install -q --upgrade pip
        /tmp/venv/bin/pip install -q -r requirements.txt pytest
        PYTHONPATH=. /tmp/venv/bin/python -m pytest tests -q

  # 2. Build the image.
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - infra/Dockerfile
      - -t
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA'
      - .

  # 3. Push. Tag with the immutable commit SHA so a deployment is traceable to
  #    the exact source that was tested in step 1.
  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA'

  # 4. Deploy. --no-allow-unauthenticated is the default posture: callers
  #    present a Firebase ID token, and the API derives roles from its claims.
  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - '${_SERVICE}'
      - --image
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/${_SERVICE}:$COMMIT_SHA'
      - --region
      - '${_REGION}'
      - --platform
      - managed
      - --port
      - '8080'
      - --service-account
      - 'farm-intelligence-backend@$PROJECT_ID.iam.gserviceaccount.com'
      - --set-env-vars
      - ENVIRONMENT=prod,MOCK_SERVICES=${_MOCK_SERVICES},GCP_PROJECT_ID=$PROJECT_ID,LOG_JSON=true,LOG_LEVEL=INFO
      - --set-secrets
      - GEMINI_API_KEY=farm-gemini-api-key:latest
      - --min-instances
      - '${_MIN_INSTANCES}'
      - --max-instances
      - '${_MAX_INSTANCES}'
      - --concurrency
      - '40'
      - --no-allow-unauthenticated

  # 5. Smoke test the deployed revision. /health is public and reports which
  #    providers are live versus mocked, so a misconfigured deployment is
  #    visible here rather than in a farmer's hands.
  - id: smoke
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        URL=$(gcloud run services describe '${_SERVICE}' --region='${_REGION}' --format='value(status.url)')
        echo "health: $URL/health"
        gcloud run services proxy '${_SERVICE}' --region='${_REGION}' --platform=managed --port=8081 &
        PROXY_PID=$!
        trap 'kill $PROXY_PID 2>/dev/null || true' EXIT
        sleep 5
        curl --fail --silent --show-error http://127.0.0.1:8081/health | tee /dev/stderr | grep -q '"status"'
